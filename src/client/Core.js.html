<script>
/**
 * Inti client: pemanggilan API, sesi, dan perpindahan halaman.
 * Semua panggilan server lewat callApi(); di Fase 2 isinya cukup diganti
 * fetch('/api/' + route), halaman lain tidak perlu berubah.
 */
var SIULIN = (function () {
  var SESSION_KEY = 'siulin.session';
  var pages = {};
  var views = {};
  var state = { session: null, user: null };

  function callApi(route, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) return resolve(res.data);
          var err = (res && res.error) || { code: 'INTERNAL', message: 'Respons server tidak dikenal.' };
          if (err.code === 'UNAUTHENTICATED' && route !== 'auth.login') clearSession();
          reject(err);
        })
        .withFailureHandler(function (e) {
          reject({ code: 'NETWORK', message: 'Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.', cause: String(e) });
        })
        .apiCall(route, state.session, payload || {});
    });
  }

  function saveSession(sessionId, user) {
    state.session = sessionId;
    state.user = user;
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ id: sessionId, user: user })); } catch (e) {}
  }

  function clearSession() {
    state.session = null;
    state.user = null;
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    show('login');
  }

  function restoreSession() {
    try {
      var saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      if (saved && saved.id) { state.session = saved.id; state.user = saved.user; }
    } catch (e) {}
  }

  /** Daftarkan halaman: { el: 'page-id', onShow: fn } */
  function page(name, def) { pages[name] = def; }

  function show(name, params) {
    Object.keys(pages).forEach(function (n) {
      document.getElementById(pages[n].el).hidden = n !== name;
    });
    if (pages[name] && pages[name].onShow) pages[name].onShow(params || {});
  }

  /** Daftarkan tampilan di dalam dashboard: { title, render(el) } */
  function view(key, def) { views[key] = def; }
  function hasView(key) { return !!views[key]; }
  function getView(key) { return views[key]; }

  /** Unduh teks sebagai file (CSV kredensial, export). */
  function download(filename, text, mime) {
    var blob = new Blob(['\ufeff' + text], { type: (mime || 'text/csv') + ';charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /** Ubah array baris menjadi teks CSV (pemisah koma, kutip bila perlu). */
  function toCsv(rows) {
    return rows.map(function (r) {
      return r.map(function (v) {
        v = v === null || v === undefined ? '' : String(v);
        return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\r\n');
  }

  /**
   * Baca teks tabel dari CSV/TSV (tempel dari Excel/Google Sheets menghasilkan TSV).
   * Baris pertama = header. Mengembalikan array objek dengan _row = nomor baris di file.
   */
  function parseTable(text) {
    text = String(text || '').replace(/^\ufeff/, '');
    var firstLine = text.split(/\r?\n/)[0] || '';
    var delim = firstLine.indexOf('\t') >= 0 ? '\t' : (firstLine.indexOf(';') >= 0 ? ';' : ',');
    var rows = [], row = [], cell = '', quoted = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (quoted) {
        if (c === '"' && text.charAt(i + 1) === '"') { cell += '"'; i++; }
        else if (c === '"') quoted = false;
        else cell += c;
      } else if (c === '"' && cell === '') quoted = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text.charAt(i + 1) === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
    if (!rows.length) return [];
    var header = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
    return rows.slice(1).map(function (r, idx) {
      var obj = { _row: idx + 2 };
      header.forEach(function (h, j) { if (h) obj[h] = String(r[j] === undefined ? '' : r[j]).trim(); });
      return obj;
    });
  }

  function loading(on) { document.getElementById('loading').hidden = !on; }

  var toastTimer = null;
  function toast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 4000);
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function start() {
    restoreSession();
    if (!state.session) return show('login');
    loading(true);
    callApi('auth.me')
      .then(function (data) { state.user = data.user; show('dashboard'); })
      .catch(function () { clearSession(); })
      .then(function () { loading(false); });
  }

  return {
    state: state, callApi: callApi, saveSession: saveSession, clearSession: clearSession,
    page: page, show: show, view: view, hasView: hasView, getView: getView,
    loading: loading, toast: toast, esc: esc, start: start,
    download: download, toCsv: toCsv, parseTable: parseTable
  };
})();

document.addEventListener('DOMContentLoaded', SIULIN.start);
</script>
