<style>
  :root {
    --bg: #f5f7fb; --card: #ffffff; --text: #1d2433; --muted: #5b6475;
    --line: #dde2ec; --primary: #1f5fbf; --primary-ink: #ffffff;
    --danger: #b42318; --ok: #157347; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login { width: 100%; max-width: 380px; }
  .field { display: block; margin: 0 0 14px; }
  .field span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .btn { display: inline-block; padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); width: 100%; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 0 0 8px; }
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: #12203a; color: #dfe6f3; padding: 20px 14px; }
  .sidebar .brand { font-weight: 700; font-size: 18px; margin: 0 6px 20px; color: #fff; }
  .sidebar a { display: block; padding: 8px 10px; border-radius: 8px; color: inherit; text-decoration: none; }
  .sidebar a.active, .sidebar a:hover { background: rgba(255,255,255,.1); }
  .sidebar .soon { opacity: .5; pointer-events: none; }
  .main { padding: 24px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #e7eefb; color: var(--primary); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 16px; }
  .toolbar .field { margin: 0; min-width: 160px; }
  .toolbar .spacer { flex: 1; }
  .btn-sm { padding: 6px 10px; font-size: 13px; }
  .btn-blue { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #fafbfd; }
  tr:last-child td { border-bottom: 0; }
  td.actions { white-space: nowrap; text-align: right; }
  .status-AKTIF { color: var(--ok); font-weight: 600; }
  .status-NONAKTIF { color: var(--muted); }
  .panel { margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  textarea { width: 100%; min-height: 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .notice { padding: 10px 12px; border-radius: 8px; background: #fff7e6; border: 1px solid #f3d38b; font-size: 14px; margin-bottom: 12px; }
  .notice.ok { background: #ecf8f1; border-color: #a6dcbc; }
  .errors { margin: 0; padding-left: 18px; color: var(--danger); font-size: 14px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
  .q-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .q-head .spacer { flex: 1; }
  .q-text { white-space: pre-wrap; margin: 0 0 8px; }
  .q-opts { margin: 0; padding: 0; list-style: none; }
  .q-opts li { padding: 4px 8px; border-radius: 6px; }
  .q-opts li.key { background: #ecf8f1; font-weight: 600; }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt-row input[type=text] { flex: 1; }
  .opt-row .opt-id { width: 28px; font-weight: 700; text-align: center; }
  .opt-row select { width: 150px; }
  .opt-row input[type=checkbox], .opt-row input[type=radio] { width: auto; }
  .st-BELUM { color: var(--primary); font-weight: 600; }
  .st-BERLANGSUNG { color: var(--ok); font-weight: 600; }
  .st-SELESAI { color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; font-weight: 600; font-size: 14px; }
  .check input { width: auto; }
  .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .token-code { font: 700 40px/1.1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; margin: 12px 0 4px; }
  .token-none { font-size: 15px; color: var(--muted); margin: 16px 0; }
  #page-exam { min-height: 100vh; display: flex; flex-direction: column; }
  .exam-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #12203a; color: #fff; }
  .exam-bar .muted { color: #b9c4d8; display: block; font-size: 12px; }
  .exam-title { flex: 1; min-width: 0; }
  .exam-title strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exam-timer { font: 700 22px/1 ui-monospace, Menlo, Consolas, monospace; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.1); }
  .exam-timer.low { background: var(--danger); }
  #ex-nav-toggle { display: none; }
  .exam-body { flex: 1; display: grid; grid-template-columns: 1fr 260px; gap: 16px; padding: 16px; max-width: 1200px; width: 100%; margin: 0 auto; }
  .exam-main { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .exam-text { font-size: 17px; line-height: 1.6; }
  .choices { display: grid; gap: 8px; margin: 12px 0; }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 16px; }
  .choice input { width: auto; margin-top: 4px; }
  .choice .letter { font-weight: 700; min-width: 18px; }
  .choice:has(input:checked) { border-color: var(--primary); background: #eef3fc; }
  .exam-main td input[type=radio] { width: 20px; height: 20px; }
  .exam-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .exam-doubt { margin: 0; }
  .exam-nav { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; align-self: start; position: sticky; top: 72px; }
  .exam-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .exam-grid button { padding: 8px 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .exam-grid button.answered { background: var(--primary); border-color: var(--primary); color: #fff; }
  .exam-grid button.doubt { background: #f5b301; border-color: #f5b301; color: #1d2433; }
  .exam-grid button.current { outline: 2px solid #1d2433; outline-offset: 1px; }
  .exam-legend { font-size: 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .sw.answered { background: var(--primary); } .sw.doubt { background: #f5b301; margin-left: 8px; }
  .exam-done { position: fixed; inset: 0; background: rgba(18,32,58,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .me-start { display: flex; gap: 8px; align-items: flex-end; }
  .me-start .field { margin: 0; flex: 1; }
  @media (max-width: 800px) {
    .exam-body { grid-template-columns: 1fr; padding: 8px; }
    #ex-nav-toggle { display: inline-block; }
    .exam-nav { display: none; position: fixed; top: 56px; left: 8px; right: 8px; z-index: 6; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .exam-nav.open { display: block; }
  }
  .loading { position: fixed; top: 0; left: 0; right: 0; padding: 6px; text-align: center; background: var(--primary); color: #fff; font-size: 13px; z-index: 10; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 10; max-width: calc(100% - 32px); }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { padding: 12px; }
    .main { padding: 16px; }
  }

  /* Rekap nilai */
  .main { min-width: 0; }
  .toolbar .field { max-width: 100%; }
  .toolbar .field-wide { flex: 1 1 260px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { padding: 16px; }
  .stat-value { font-size: 26px; font-weight: 700; line-height: 1.2; margin: 4px 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
  .tab { border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .bar { width: 100px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  .bar span { display: block; height: 100%; background: var(--primary); }
  .rs-MENGERJAKAN { color: var(--primary); font-weight: 600; }
  .rs-SELESAI { color: var(--ok); font-weight: 600; }
  .rs-WAKTU_HABIS { color: #9a6700; font-weight: 600; }
  .rs-BELUM { color: var(--muted); }
  .rs-gagal { color: var(--danger); font-weight: 600; }
  .rs-teks { max-width: 320px; }
  .rs-opsi { margin: 8px 0; padding-left: 0; list-style: none; }
  .q-card.rs-benar { border-left: 4px solid var(--ok); }
  .q-card.rs-sebagian { border-left: 4px solid #d4a72c; }
  .q-card.rs-salah { border-left: 4px solid var(--danger); }
  .q-card.rs-manual { border-left: 4px solid var(--muted); }
</style>
