<script>
// Tampilan "Topik ujian" untuk SUPER_ADMIN.
SIULIN.view('topics', {
  title: 'Topik ujian',
  render: function (el) {
    var esc = SIULIN.esc;
    var topics = [];
    var editing = null;
    el.innerHTML =
      '<div class="toolbar"><div class="spacer"></div><button class="btn btn-blue" id="tp-add" type="button">Tambah topik</button></div>' +
      '<form id="tp-form" class="card panel" hidden novalidate><h2 id="tp-title"></h2><div class="grid-2">' +
      '<label class="field"><span>Nama topik</span><input name="nama_topik" placeholder="Asesmen Sumatif Akhir Tahun Genap"></label>' +
      '<label class="field"><span>Inisial (dipakai di nama ujian)</span><input name="inisial" placeholder="ASAT_Genap"></label>' +
      '<label class="field"><span>Tahun ajaran</span><input name="tahun_ajaran" placeholder="2026/2027"></label>' +
      '<label class="field"><span>Status</span><select name="status"><option>AKTIF</option><option>NONAKTIF</option></select></label>' +
      '</div><p class="error" id="tp-error" role="alert"></p>' +
      '<button class="btn btn-blue" type="submit">Simpan</button> <button class="btn" type="button" id="tp-cancel">Batal</button></form>' +
      '<div class="table-wrap"><table><thead><tr><th>Inisial</th><th>Nama topik</th><th>Tahun ajaran</th><th>Status</th><th></th></tr></thead><tbody id="tp-body"></tbody></table></div>';
    var form = el.querySelector('#tp-form');

    function load() {
      SIULIN.callApi('topic.list', {}).then(function (d) {
        topics = d;
        el.querySelector('#tp-body').innerHTML = d.length ? d.map(function (t) {
          return '<tr><td><strong>' + esc(t.inisial) + '</strong></td><td>' + esc(t.nama_topik) + '</td><td>' + esc(t.tahun_ajaran) +
            '</td><td class="status-' + esc(t.status) + '">' + esc(t.status) + '</td><td class="actions"><button class="btn btn-sm" type="button" data-id="' + esc(t.topic_id) + '">Ubah</button></td></tr>';
        }).join('') : '<tr><td colspan="5" class="empty">Belum ada topik.</td></tr>';
      }).catch(function (e) { SIULIN.toast(e.message); });
    }

    function openForm(t) {
      editing = t;
      form.hidden = false;
      el.querySelector('#tp-title').textContent = t ? 'Ubah topik' : 'Tambah topik';
      ['nama_topik', 'inisial', 'tahun_ajaran'].forEach(function (k) { form[k].value = t ? t[k] : ''; });
      form.status.value = t ? t.status : 'AKTIF';
      el.querySelector('#tp-error').textContent = '';
    }

    el.querySelector('#tp-add').addEventListener('click', function () { openForm(null); });
    el.querySelector('#tp-cancel').addEventListener('click', function () { form.hidden = true; });
    el.querySelector('#tp-body').addEventListener('click', function (ev) {
      var id = ev.target.getAttribute('data-id');
      if (id) openForm(topics.filter(function (t) { return t.topic_id === id; })[0]);
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var p = { nama_topik: form.nama_topik.value, inisial: form.inisial.value, tahun_ajaran: form.tahun_ajaran.value, status: form.status.value };
      if (editing) p.topic_ref = editing.topic_id;
      SIULIN.callApi(editing ? 'topic.update' : 'topic.create', p)
        .then(function () { form.hidden = true; SIULIN.toast('Topik tersimpan.'); load(); })
        .catch(function (e) { el.querySelector('#tp-error').textContent = e.message; });
    });
    load();
  }
});
</script>
