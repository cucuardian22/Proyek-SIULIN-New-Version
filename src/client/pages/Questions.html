<script>
// Bank soal satu ujian: daftar soal, editor 6 tipe, import dari template.
SIULIN.view('questions', {
  title: 'Bank soal',
  render: function (el, params) {
    var esc = SIULIN.esc;
    var CHUNK = 100;
    var LETTERS = 'ABCDEFGH';
    var TYPE_LABEL = { PG: 'Pilihan ganda', PGK: 'Pilihan ganda kompleks', PGBS: 'Benar/Salah', PGST: 'Setuju/Tidak setuju', ISIAN: 'Isian singkat', URAIAN: 'Uraian' };
    var STATEMENT_CHOICES = { PGBS: [['B', 'Benar'], ['S', 'Salah']], PGST: [['S', 'Setuju'], ['TS', 'Tidak setuju']] };
    var TEMPLATE = [['tipe', 'teks', 'bobot', 'a', 'b', 'c', 'd', 'e', 'kunci', 'media_url'],
      ['PG', 'Ibu kota Indonesia adalah ...', '1', 'Bandung', 'Jakarta', 'Surabaya', 'Medan', '', 'B', ''],
      ['PGK', 'Manakah bilangan prima?', '2', '2', '4', '5', '9', '', 'A,C', ''],
      ['PGBS', 'Tentukan benar atau salah.', '3', '2 + 2 = 4', '3 > 5', '0 adalah bilangan genap', '', '', 'B,S,B', ''],
      ['PGST', 'Tentukan sikapmu.', '2', 'Membuang sampah pada tempatnya', 'Mencontek saat ujian', '', '', '', 'S,TS', ''],
      ['ISIAN', '5 x 5 = ...', '1', '', '', '', '', '', '25|dua puluh lima', ''],
      ['URAIAN', 'Jelaskan proses fotosintesis.', '5', '', '', '', '', '', 'Pedoman: menyebut klorofil, cahaya, CO2', '']];
    var data = null;
    var editing = null;

    el.innerHTML =
      '<div class="toolbar"><button class="btn" type="button" id="q-back">&larr; Daftar ujian</button><div><strong id="q-exam"></strong><div class="muted" id="q-meta"></div></div>' +
      '<div class="spacer"></div><span id="q-tools"><button class="btn" type="button" id="q-import-open">Import</button> <button class="btn btn-blue" type="button" id="q-add">Tambah soal</button></span></div>' +
      '<form id="q-form" class="card panel" hidden novalidate><h2 id="q-form-title"></h2><div class="grid-2">' +
      '<label class="field"><span>Tipe soal</span><select name="tipe">' + Object.keys(TYPE_LABEL).map(function (t) { return '<option value="' + t + '">' + t + ' - ' + TYPE_LABEL[t] + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>Bobot</span><input name="bobot" type="number" min="0.25" step="0.25" value="1"></label></div>' +
      '<label class="field"><span>Teks soal</span><textarea name="teks" style="min-height:100px;font-family:inherit;font-size:15px"></textarea></label>' +
      '<label class="field"><span>Link gambar/media (opsional, https://)</span><input name="media_url"></label>' +
      '<div id="q-answer"></div><p class="error" id="q-error" role="alert"></p>' +
      '<button class="btn btn-blue" type="submit">Simpan</button> <button class="btn" type="button" id="q-cancel">Batal</button></form>' +
      '<div id="q-import" class="card panel" hidden><h2>Import soal</h2>' +
      '<p class="muted">Satu baris per soal. Kolom: tipe, teks, bobot, a sampai e (opsi atau pernyataan), kunci, media_url. Tempel dari Excel/Google Sheets atau pilih file CSV. Lihat contoh semua tipe di template.</p>' +
      '<div class="toolbar"><input type="file" id="q-file" accept=".csv,.tsv,.txt"><button class="btn btn-sm" type="button" id="q-template">Unduh template</button></div>' +
      '<textarea id="q-paste"></textarea><div id="q-import-result" style="margin-top:12px"></div>' +
      '<button class="btn btn-blue" type="button" id="q-import-run">Periksa lalu import</button> <button class="btn" type="button" id="q-import-close">Tutup</button></div>' +
      '<div id="q-list"><div class="empty">Memuat...</div></div>';
    var $ = function (s) { return el.querySelector(s); };
    var form = $('#q-form');

    // ---------- daftar ----------

    function load() {
      SIULIN.callApi('question.list', { exam_ref: params.exam_id }).then(function (d) {
        data = d;
        $('#q-exam').textContent = d.exam.nama_ujian;
        var total = d.questions.reduce(function (s, q) { return s + (Number(q.bobot) || 0); }, 0);
        $('#q-meta').textContent = d.questions.length + ' soal, total bobot ' + total + (d.editable ? '' : ' (bank soal pusat, hanya baca)');
        $('#q-tools').hidden = !d.editable;
        draw();
      }).catch(function (e) { $('#q-list').innerHTML = '<div class="notice">' + esc(e.message) + '</div>'; });
    }

    function optionsHtml(q) {
      if (q.tipe === 'PG' || q.tipe === 'PGK') {
        var keys = [].concat(q.kunci || []);
        return '<ul class="q-opts">' + q.opsi.map(function (o) {
          return '<li class="' + (keys.indexOf(o.id) >= 0 ? 'key' : '') + '">' + esc(o.id) + '. ' + esc(o.teks) + '</li>';
        }).join('') + '</ul>';
      }
      if (STATEMENT_CHOICES[q.tipe]) {
        return '<ul class="q-opts">' + q.opsi.map(function (o, i) {
          return '<li>' + (i + 1) + '. ' + esc(o.teks) + ' &rarr; <strong>' + esc((q.kunci || {})[o.id]) + '</strong></li>';
        }).join('') + '</ul>';
      }
      if (q.tipe === 'ISIAN') return '<div class="muted">Jawaban diterima: <strong>' + esc((q.kunci || []).join(' | ')) + '</strong></div>';
      return q.kunci ? '<div class="muted">Pedoman: ' + esc(q.kunci) + '</div>' : '';
    }

    function draw() {
      if (!data.questions.length) { $('#q-list').innerHTML = '<div class="card empty">Belum ada soal. Tambah satu per satu atau import dari template.</div>'; return; }
      $('#q-list').innerHTML = data.questions.map(function (q, i) {
        return '<div class="q-card"><div class="q-head"><strong>' + (i + 1) + '.</strong><span class="badge">' + esc(q.tipe) + '</span><span class="muted">bobot ' + esc(q.bobot) + '</span><span class="spacer"></span>' +
          (data.editable ? '<button class="btn btn-sm" type="button" data-act="edit" data-id="' + esc(q.question_id) + '">Ubah</button> <button class="btn btn-sm" type="button" data-act="del" data-id="' + esc(q.question_id) + '">Hapus</button>' : '') +
          '</div><p class="q-text">' + esc(q.teks) + '</p>' + (q.media_url ? '<p><a href="' + esc(q.media_url) + '" target="_blank" rel="noopener">Lihat media</a></p>' : '') + optionsHtml(q) + '</div>';
      }).join('');
    }

    // ---------- editor ----------

    function optionRow(tipe, i, teks, checked, value) {
      var id = STATEMENT_CHOICES[tipe] ? String(i + 1) : LETTERS.charAt(i);
      var control = tipe === 'PG' ? '<input type="radio" name="kunci-pg" value="' + id + '"' + (checked ? ' checked' : '') + ' title="Kunci">'
        : tipe === 'PGK' ? '<input type="checkbox" class="kunci-pgk" value="' + id + '"' + (checked ? ' checked' : '') + ' title="Kunci">'
        : '<select class="kunci-st"><option value="">Pilih kunci</option>' + STATEMENT_CHOICES[tipe].map(function (c) { return '<option value="' + c[0] + '"' + (value === c[0] ? ' selected' : '') + '>' + c[1] + '</option>'; }).join('') + '</select>';
      return '<div class="opt-row"><span class="opt-id">' + id + '</span><input type="text" class="opt-teks" value="' + esc(teks) + '" placeholder="' + (STATEMENT_CHOICES[tipe] ? 'Pernyataan' : 'Opsi') + ' ' + id + '">' + control +
        '<button class="btn btn-sm opt-del" type="button" title="Hapus">&times;</button></div>';
    }

    function drawAnswer(tipe, q) {
      var box = $('#q-answer');
      if (tipe === 'ISIAN') {
        box.innerHTML = '<label class="field"><span>Jawaban yang diterima (pisahkan dengan |)</span><input id="kunci-isian" value="' + esc(q && q.tipe === 'ISIAN' ? (q.kunci || []).join('|') : '') + '"></label>';
        return;
      }
      if (tipe === 'URAIAN') {
        box.innerHTML = '<label class="field"><span>Pedoman penskoran (opsional)</span><input id="kunci-uraian" value="' + esc(q && q.tipe === 'URAIAN' ? q.kunci : '') + '"></label>';
        return;
      }
      var same = q && q.tipe === tipe;
      var opsi = same ? q.opsi : (q && q.opsi && q.opsi.length ? q.opsi : [{}, {}, {}, {}]);
      var keys = same ? [].concat(q.kunci || []) : [];
      var hint = tipe === 'PG' ? 'Pilih satu kunci.' : tipe === 'PGK' ? 'Centang semua kunci (lebih dari satu boleh).' : 'Tentukan jawaban benar setiap pernyataan.';
      box.innerHTML = '<div class="field"><span>' + (STATEMENT_CHOICES[tipe] ? 'Pernyataan' : 'Opsi jawaban') + '</span><p class="muted" style="margin:0 0 8px">' + hint + '</p><div id="opt-list">' +
        opsi.map(function (o, i) {
          var id = STATEMENT_CHOICES[tipe] ? String(i + 1) : LETTERS.charAt(i);
          return optionRow(tipe, i, o.teks || '', keys.indexOf(id) >= 0, same && q.kunci ? q.kunci[o.id] : '');
        }).join('') + '</div><button class="btn btn-sm" type="button" id="opt-add">Tambah ' + (STATEMENT_CHOICES[tipe] ? 'pernyataan' : 'opsi') + '</button></div>';
    }

    /** Baca isi editor, nomori ulang opsi sesuai urutan baris. */
    function readAnswer(tipe) {
      if (tipe === 'ISIAN') return { opsi: [], kunci: $('#kunci-isian').value };
      if (tipe === 'URAIAN') return { opsi: [], kunci: $('#kunci-uraian').value };
      var opsi = [], pgk = [], pg = '', st = {};
      Array.prototype.forEach.call(el.querySelectorAll('#opt-list .opt-row'), function (row, i) {
        var id = STATEMENT_CHOICES[tipe] ? String(i + 1) : LETTERS.charAt(i);
        opsi.push({ id: id, teks: row.querySelector('.opt-teks').value });
        if (tipe === 'PG' && row.querySelector('input[type=radio]').checked) pg = id;
        if (tipe === 'PGK' && row.querySelector('.kunci-pgk').checked) pgk.push(id);
        if (STATEMENT_CHOICES[tipe]) st[id] = row.querySelector('.kunci-st').value;
      });
      return { opsi: opsi, kunci: tipe === 'PG' ? pg : tipe === 'PGK' ? pgk : st };
    }

    function renumber() {
      var tipe = form.tipe.value;
      var state = readAnswer(tipe);
      // Gambar ulang supaya label A, B, C ... tetap berurutan setelah hapus/tambah.
      drawAnswer(tipe, { tipe: tipe, opsi: state.opsi, kunci: state.kunci });
    }

    function openForm(q) {
      editing = q;
      form.hidden = false;
      $('#q-import').hidden = true;
      $('#q-form-title').textContent = q ? 'Ubah soal' : 'Tambah soal';
      form.tipe.value = q ? q.tipe : 'PG';
      form.bobot.value = q ? q.bobot : 1;
      form.teks.value = q ? q.teks : '';
      form.media_url.value = q ? q.media_url : '';
      $('#q-error').textContent = '';
      drawAnswer(form.tipe.value, q);
      form.scrollIntoView();
      form.teks.focus();
    }

    form.tipe.addEventListener('change', function () {
      var prev = readAnswerSafe();
      drawAnswer(form.tipe.value, prev);
    });
    function readAnswerSafe() {
      var row = el.querySelector('#opt-list');
      if (!row) return null;
      var opsi = Array.prototype.map.call(el.querySelectorAll('#opt-list .opt-teks'), function (i) { return { teks: i.value }; });
      return { tipe: '', opsi: opsi };
    }

    $('#q-answer').addEventListener('click', function (ev) {
      if (ev.target.id === 'opt-add') {
        if (el.querySelectorAll('#opt-list .opt-row').length >= 8) return SIULIN.toast('Maksimal 8 opsi.');
        var tipe = form.tipe.value;
        var n = el.querySelectorAll('#opt-list .opt-row').length;
        $('#opt-list').insertAdjacentHTML('beforeend', optionRow(tipe, n, '', false, ''));
      } else if (ev.target.classList.contains('opt-del')) {
        ev.target.closest('.opt-row').remove();
        renumber();
      }
    });

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var tipe = form.tipe.value;
      var ans = readAnswer(tipe);
      var p = { tipe: tipe, bobot: form.bobot.value, teks: form.teks.value, media_url: form.media_url.value, opsi: ans.opsi, kunci: ans.kunci };
      if (editing) p.question_ref = editing.question_id; else p.exam_ref = params.exam_id;
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      SIULIN.callApi(editing ? 'question.update' : 'question.create', p)
        .then(function () { form.hidden = true; SIULIN.toast('Soal tersimpan.'); load(); })
        .catch(function (e) { $('#q-error').textContent = e.message; })
        .then(function () { btn.disabled = false; });
    });

    $('#q-list').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-act]');
      if (!b) return;
      var q = data.questions.filter(function (x) { return x.question_id === b.getAttribute('data-id'); })[0];
      if (b.getAttribute('data-act') === 'edit') return openForm(q);
      if (!confirm('Hapus soal ini?')) return;
      SIULIN.callApi('question.remove', { question_ref: q.question_id }).then(function () { SIULIN.toast('Soal dihapus.'); load(); })
        .catch(function (e) { SIULIN.toast(e.message); });
    });

    // ---------- import ----------

    function showErrors(errors) {
      $('#q-import-result').innerHTML = '<div class="notice"><strong>Tidak ada yang disimpan.</strong> Perbaiki baris berikut:</div><ul class="errors">' +
        errors.slice(0, 50).map(function (e) { return '<li>Baris ' + e.row + ': ' + esc(e.messages.join(' ')) + '</li>'; }).join('') + '</ul>';
    }

    function send(parts, dryRun, onProgress) {
      var result = { inserted: 0, errors: [] };
      return parts.reduce(function (p, part, i) {
        return p.then(function () {
          if (!dryRun && result.errors.length) return;
          return SIULIN.callApi('question.import', { exam_ref: params.exam_id, rows: part, dry_run: dryRun }).then(function (r) {
            result.inserted += r.inserted;
            result.errors = result.errors.concat(r.errors);
            onProgress(i + 1, parts.length);
          });
        });
      }, Promise.resolve()).then(function () { return result; });
    }

    $('#q-import-run').addEventListener('click', function () {
      var rows = SIULIN.parseTable($('#q-paste').value);
      var out = $('#q-import-result');
      if (!rows.length) { out.innerHTML = '<div class="notice">Tempel data atau pilih file dulu.</div>'; return; }
      if (!('tipe' in rows[0]) || !('teks' in rows[0])) { out.innerHTML = '<div class="notice">Baris judul wajib memuat kolom <strong>tipe</strong> dan <strong>teks</strong>. Gunakan template.</div>'; return; }
      var parts = [];
      for (var i = 0; i < rows.length; i += CHUNK) parts.push(rows.slice(i, i + CHUNK));
      var btn = this;
      btn.disabled = true;
      out.innerHTML = '<div class="notice">Memeriksa ' + rows.length + ' soal...</div>';
      send(parts, true, function () {}).then(function (check) {
        if (check.errors.length) return showErrors(check.errors);
        return send(parts, false, function (d, t) { out.innerHTML = '<div class="notice">Menyimpan bagian ' + d + ' dari ' + t + '...</div>'; }).then(function (r) {
          if (r.errors.length) return showErrors(r.errors);
          out.innerHTML = '<div class="notice ok">' + r.inserted + ' soal berhasil diimport.</div>';
          $('#q-paste').value = '';
          load();
        });
      }).catch(function (e) { out.innerHTML = '<div class="notice">' + esc(e.message) + '</div>'; })
        .then(function () { btn.disabled = false; });
    });

    $('#q-file').addEventListener('change', function () {
      var f = this.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { $('#q-paste').value = r.result; };
      r.readAsText(f);
    });
    $('#q-template').addEventListener('click', function () { SIULIN.download('template-soal.csv', SIULIN.toCsv(TEMPLATE)); });
    $('#q-import-open').addEventListener('click', function () { $('#q-import').hidden = false; form.hidden = true; });
    $('#q-import-close').addEventListener('click', function () { $('#q-import').hidden = true; });
    $('#q-add').addEventListener('click', function () { openForm(null); });
    $('#q-cancel').addEventListener('click', function () { form.hidden = true; });
    $('#q-back').addEventListener('click', function () { SIULIN.openView('exams'); });

    if (!params.exam_id) { SIULIN.openView('exams'); return; }
    load();
  }
});
</script>
